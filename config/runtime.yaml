schema_version: forex.runtime.v2
environment: development
runtime_mode: DEMO_TRADING
agent_authority_mode: DEMO_SESSION_BOUNDED
live_trading_enabled: false
maximum_concurrent_positions: 1
persistent_risk_policy:
  policy_version: forex.m20.conservative-risk.v1
  reporting_currency: AUD
  maximum_risk_per_trade_percent: 0.10
  maximum_risk_per_trade_aud: 100.00
  daily_loss_limit_percent: 0.50
  weekly_loss_limit_percent: 1.00
  peak_equity_drawdown_limit_percent: 2.00
  loss_budget_timezone: Pacific/Auckland
  daily_pause_reset: NEXT_AUCKLAND_DAY
  manual_resume_reasons: [WEEKLY_LOSS, PEAK_DRAWDOWN, EXTERNAL_CASH_FLOW, UNKNOWN_ACCOUNT_STATE]
  require_known_external_cashflow: true
demo_session_limits:
  # null removes the legacy total-count ceiling. Cumulative notional remains
  # the total Demo exposure cap.
  maximum_trades: null
  # Zero denotes continuous Demo-only authority; Live remains disabled.
  maximum_duration_minutes: 0
  maximum_open_positions: 1
  maximum_notional_per_trade_usd: 10000
  maximum_cumulative_notional_usd: 100000
  maximum_loss_per_trade_aud: 100
  # A plan must project at least this net AUD result at TP after the fixed cost model.
  minimum_net_profit_aud: 0.10
  require_persisted_proposal: true
  require_idempotency_key: true

# Existing 6–10 minute owner exits remain authoritative. Unknown broker terms
# block entries; this mandate does not enable overnight holding or new exits.
financing_policy:
  policy_version: forex.m20.financing.v1
  qualification_basis: DEMO_CONSERVATIVE_INTRADAY
  entry_start_hour_utc: 6
  exit_by_hour_utc: 18
  exit_mode: EXISTING_OWNER_EXITS
  maximum_quote_age_seconds: 10
  calendar_valid_from_utc: '2026-09-10T00:00:00Z'
  calendar_valid_until_utc: '2026-09-17T00:00:00Z'
  calendar_source: 'Research/2026-09-10-w1-broker-blocker-resolution.md#sources-and-conclusions'
  rollovers: []
  round_trip_charge_aud_per_lot: 6.0
  charge_source: 'Research/2026-09-10-w1-broker-blocker-resolution.md#implemented-resolution'
