[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "successbycs-forex"
version = "0.1.0"
description = "Evidence-gated Forex research and trading-assistance project"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.10,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
forex-milestones = "forex.milestones:main"
forex-config = "forex.config:main"
forex-triad = "forex.triad:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
