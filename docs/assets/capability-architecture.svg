<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Forex capability architecture</title>
  <desc id="desc">External publishers and MetaTrader feed immutable evidence. Python services validate it and write validated lifecycle and analytics facts to PostgreSQL. Host schedulers run local services. n8n handles notifications and human workflows. Only the fixed Python and T480 path can place capped Demo trades.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.zone{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#0f172a}.zone-title{font:700 18px Arial,sans-serif;fill:#334155}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.node{stroke-width:2}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 7}.note{font:700 15px Arial,sans-serif;fill:#9f1239}
    </style>
  </defs>
  <rect class="bg" width="1600" height="940" rx="18"/>
  <text x="70" y="62" class="title">Forex capability architecture — current target structure</text>
  <text x="70" y="91" class="sub">Evidence proves • PostgreSQL connects durable facts • Python decides • n8n coordinates • only a fixed T480 path reaches MT5 Demo</text>

  <rect x="55" y="130" width="300" height="610" rx="16" class="zone"/>
  <text x="80" y="165" class="zone-title">External sources</text>
  <rect x="85" y="210" width="240" height="105" rx="12" fill="#e0f2fe" stroke="#0284c7" class="node"/>
  <text x="205" y="251" text-anchor="middle" class="label">Public publishers</text>
  <text x="205" y="278" text-anchor="middle" class="sub">BLS • FOMC • ECB</text>
  <rect x="85" y="445" width="240" height="135" rx="12" fill="#fce7f3" stroke="#be185d" class="node"/>
  <text x="205" y="487" text-anchor="middle" class="label">MetaTrader 5</text>
  <text x="205" y="515" text-anchor="middle" class="sub">GOMarketsMU-Demo only</text>
  <text x="205" y="544" text-anchor="middle" class="note">Live is prohibited</text>

  <rect x="410" y="130" width="330" height="610" rx="16" class="zone"/>
  <text x="435" y="165" class="zone-title">Evidence and provenance</text>
  <rect x="445" y="210" width="260" height="135" rx="12" fill="#dbeafe" stroke="#1d4ed8" class="node"/>
  <text x="575" y="250" text-anchor="middle" class="label">Immutable raw evidence</text>
  <text x="575" y="277" text-anchor="middle" class="sub">HTML • MT5 exports • spool</text>
  <text x="575" y="302" text-anchor="middle" class="sub">records • source bytes</text>
  <rect x="445" y="470" width="260" height="135" rx="12" fill="#dbeafe" stroke="#1d4ed8" class="node"/>
  <text x="575" y="510" text-anchor="middle" class="label">Hash-bound receipts</text>
  <text x="575" y="537" text-anchor="middle" class="sub">capture metadata • proof</text>
  <text x="575" y="562" text-anchor="middle" class="sub">bundles • verification</text>

  <rect x="795" y="130" width="390" height="610" rx="16" class="zone"/>
  <text x="820" y="165" class="zone-title">Forex application core</text>
  <rect x="830" y="210" width="320" height="150" rx="12" fill="#dcfce7" stroke="#15803d" class="node"/>
  <text x="990" y="250" text-anchor="middle" class="label">Python domain services</text>
  <text x="990" y="278" text-anchor="middle" class="sub">validation • risk • sizing</text>
  <text x="990" y="303" text-anchor="middle" class="sub">recovery • reconciliation</text>
  <text x="990" y="328" text-anchor="middle" class="sub">reports and deterministic rules</text>
  <ellipse cx="990" cy="545" rx="160" ry="82" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="990" y="533" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="990" y="560" text-anchor="middle" class="sub">validated lifecycle state</text>
  <text x="990" y="585" text-anchor="middle" class="sub">joins • analytics • reporting</text>

  <rect x="1240" y="130" width="305" height="610" rx="16" class="zone"/>
  <text x="1265" y="165" class="zone-title">Operations and people</text>
  <rect x="1270" y="210" width="245" height="105" rx="12" fill="#fef3c7" stroke="#b45309" class="node"/>
  <text x="1392" y="250" text-anchor="middle" class="label">Host schedulers</text>
  <text x="1392" y="278" text-anchor="middle" class="sub">systemd • Windows Task</text>
  <rect x="1270" y="410" width="245" height="125" rx="12" fill="#fef3c7" stroke="#b45309" class="node"/>
  <text x="1392" y="450" text-anchor="middle" class="label">n8n</text>
  <text x="1392" y="478" text-anchor="middle" class="sub">notifications • integration</text>
  <text x="1392" y="503" text-anchor="middle" class="sub">human workflow</text>
  <rect x="1270" y="625" width="245" height="70" rx="35" fill="#fef3c7" stroke="#b45309" class="node"/>
  <text x="1392" y="668" text-anchor="middle" class="label">Chris, operator</text>

  <path d="M325 262 H445" class="line"/>
  <path d="M325 512 H445" class="line"/>
  <path d="M575 345 V470" class="line"/>
  <path d="M705 277 H830" class="line"/>
  <path d="M990 360 V455" class="line"/>
  <path d="M830 575 C765 575 765 310 830 310" class="line"/>
  <path d="M1515 262 H1185" class="line"/>
  <path d="M1150 285 H1270" class="line"/>
  <path d="M1150 525 H1270" class="line"/>
  <path d="M1392 535 V625" class="line"/>
  <path d="M1270 660 H1175 V695 H990 V360" class="line dashed"/>
  <text x="1080" y="685" class="small">explicit Demo approval only</text>
  <path d="M830 335 H780 V512 H325" class="line"/>
  <text x="408" y="430" class="small">fixed, capped T480 execution path only</text>

  <rect x="55" y="790" width="1490" height="100" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="85" y="830" class="label">Hard safety boundary</text>
  <text x="85" y="858" class="sub">n8n, PostgreSQL, reports, AI outputs, and raw-data collectors cannot submit, amend, or close a trade. Only the fixed Python/T480 Demo path may contact MT5 for a governed operation.</text>
</svg>
