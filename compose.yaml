services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forex
      POSTGRES_USER: forex
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - forex-postgres-data:/var/lib/postgresql/data
      - ./sql/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forex -d forex"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  forex-postgres-data:
